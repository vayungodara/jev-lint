[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-lint"
dynamic = ["version"]
description = "Semantic linter for Markdown knowledge bases: contradictions, stale claims, unresolved markers, and missing pages, scored with TypeSafe Jev"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vayun Godara"}]
keywords = ["markdown", "obsidian", "knowledge-base", "linter", "wiki", "typesafe", "jev"]
dependencies = ["certifi>=2024.2.2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
jev-lint = "jev_lint.cli:main"

[project.urls]
Homepage = "https://jevlint.vayun.net"
Repository = "https://github.com/vayungodara/jev-lint"
Changelog = "https://github.com/vayungodara/jev-lint/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "jev_lint.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls the live TypeSafe Jev API"]
