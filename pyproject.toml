[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-lint"
version = "0.1.0"
description = "A semantic linter for Markdown knowledge bases"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Vayun Godara"}]
dependencies = ["certifi>=2024.2.2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
jev-lint = "jev_lint.cli:main"

[project.urls]
Homepage = "https://jevlint.vayun.net"
Repository = "https://github.com/vayungodara/jev-lint"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls the live TypeSafe Jev API"]
